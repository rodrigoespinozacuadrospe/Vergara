<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    // Ensure window.fetch is writable and has a setter so extensions and test harnesses can safely wrap or mock it
    (function () {
      try {
        let currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function () {
            return currentFetch;
          },
          set: function (newFetch) {
            currentFetch = newFetch;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Fallback to value definition if getters fail
        try {
          if (window.fetch) {
            Object.defineProperty(window, 'fetch', {
              value: window.fetch.bind(window),
              writable: true,
              configurable: true,
              enumerable: true
            });
          }
        } catch (err) {}
      }
    })();
  </script>
