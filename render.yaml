services:
  - type: web
    name: vergara-logistica
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 'app:create_app()'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: VERGARA_SECRET_KEY
        generateValue: true
